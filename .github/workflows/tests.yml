# The test suite, on every push to main and every pull request.
#
# The database tests skip without MEERPAD_TEST_DB (tests/conftest.py), so a
# Postgres is provided and the variable set: a skip here would be a green tick
# for a test that never ran, and `-ra` lists every one in the summary anyway.
#
# Python and Postgres match what ships: python:3.14-slim in the Dockerfile and
# postgres:18 in docker-compose.yml. Nothing else is needed: the sign-in
# emails are printed rather than sent (conftest clears SMTP_HOST). meerpic's
# workflow, minus the agent and its tools.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # A fresh database per run. The tests drop every table they find, so this
      # must never be one that holds anything.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: meerpad
          POSTGRES_PASSWORD: meerpad
          POSTGRES_DB: meerpad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meerpad -d meerpad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MEERPAD_TEST_DB: postgresql+psycopg://meerpad:meerpad@127.0.0.1:5432/meerpad_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # pytest and httpx are not in requirements.txt because the image does
      # not need them (httpx is there anyway, for app/fetcher.py; naming it
      # here keeps this line the same as `make venv`'s).
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run the tests
        run: pytest -ra
