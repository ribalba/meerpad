<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>meerpad</title>
  <meta name="theme-color" content="#1d6ff2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/editor.css" />
  <!-- In <head> and blocking on purpose: it sets the theme attribute on <html>
       before the first paint, so a forced theme never flashes the other one. -->
  <script src="/static/js/app.theme.js"></script>
</head>
<body>
  <!-- Until app.boot.js knows who is signed in and has the pages loaded. -->
  <div class="boot" id="boot">
    <img src="/static/img/logo.png" alt="" />
    <div class="boot-text" id="boot-text">Opening meerpad…</div>
  </div>

  <div class="app" id="app" hidden>
    <!-- The drawer's backdrop on narrow screens. Inert until the drawer opens. -->
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="Pages"></aside>
    <main class="main" id="main"></main>
  </div>

  <!-- The client core: namespace and helpers, icons, floating UI, the local
       mirror, the sync loop, and the store everything reads and writes. -->
  <script src="/static/js/app.core.js"></script>
  <script src="/static/js/app.icons.js"></script>
  <script src="/static/js/app.ui.js"></script>
  <script src="/static/js/app.db.js"></script>
  <script src="/static/js/app.sync.js"></script>
  <script src="/static/js/app.store.js"></script>
  <!-- The block editor. -->
  <script src="/static/js/app.markdown.js"></script>
  <script src="/static/js/app.highlight.js"></script>
  <script src="/static/js/app.mdblocks.js"></script>
  <script src="/static/js/app.editor.js"></script>
  <script src="/static/js/app.editor.menus.js"></script>
  <script src="/static/js/app.editor.media.js"></script>
  <script src="/static/js/app.editor.input.js"></script>
  <!-- The app around it. -->
  <script src="/static/js/app.shell.js"></script>
  <script src="/static/js/app.sidebar.js"></script>
  <script src="/static/js/app.page.js"></script>
  <script src="/static/js/app.database.js"></script>
  <script src="/static/js/app.search.js"></script>
  <script src="/static/js/app.share.js"></script>
  <script src="/static/js/app.publish.js"></script>
  <script src="/static/js/app.import.js"></script>
  <script src="/static/js/app.settings.js"></script>
  <script src="/static/js/app.trash.js"></script>
  <!-- Last: everything above only defines; this starts the app. -->
  <script src="/static/js/app.boot.js"></script>
</body>
</html>
