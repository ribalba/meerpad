<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="crop" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#e7cf8a"/>
      <rect width="18" height="5" fill="#d8bb6b"/>
    </pattern>
    <pattern id="beds" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#a47c55"/>
      <rect x="3" width="8" height="26" fill="#7fae62"/>
      <rect x="15" width="8" height="26" fill="#7fae62"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#dcebc9"/>
  <path d="M0 610 C 260 590, 520 640, 760 600 S 1080 560, 1200 590 L1200 650 C 1060 620, 900 660, 760 660 S 280 660, 0 670 Z" fill="#c9b79a"/>
  <text x="1040" y="628" font-size="20" fill="#6b5a44">Farm track</text>

  <rect x="50" y="50" width="470" height="290" rx="14" fill="url(#crop)" stroke="#b9974b" stroke-width="3"/>
  <text x="80" y="100" font-size="30" font-weight="700" fill="#5c4717">North field</text>
  <text x="80" y="134" font-size="22" fill="#5c4717">Potatoes and oats, 2.4 ha</text>

  <rect x="560" y="50" width="330" height="290" rx="14" fill="#bfdc9f" stroke="#7fae62" stroke-width="3"/>
  <g fill="#3f6f2a">
    <circle cx="610" cy="180" r="22"/><circle cx="680" cy="180" r="22"/><circle cx="750" cy="180" r="22"/><circle cx="820" cy="180" r="22"/>
    <circle cx="610" cy="250" r="22"/><circle cx="680" cy="250" r="22"/><circle cx="750" cy="250" r="22"/><circle cx="820" cy="250" r="22"/>
    <circle cx="645" cy="310" r="18"/><circle cx="715" cy="310" r="18"/><circle cx="785" cy="310" r="18"/>
  </g>
  <g fill="#d8412f">
    <circle cx="602" cy="174" r="5"/><circle cx="688" cy="186" r="5"/><circle cx="744" cy="172" r="5"/><circle cx="826" cy="188" r="5"/>
    <circle cx="616" cy="258" r="5"/><circle cx="674" cy="244" r="5"/><circle cx="758" cy="256" r="5"/>
  </g>
  <text x="590" y="100" font-size="30" font-weight="700" fill="#2f5220">Orchard</text>
  <text x="590" y="134" font-size="22" fill="#2f5220">48 apple and pear trees</text>

  <ellipse cx="1030" cy="190" rx="120" ry="100" fill="#8ec9e6" stroke="#5aa6cc" stroke-width="3"/>
  <text x="985" y="198" font-size="28" font-weight="700" fill="#1f5f80">Pond</text>

  <rect x="50" y="380" width="330" height="190" rx="14" fill="url(#beds)" stroke="#7a5a3a" stroke-width="3"/>
  <rect x="64" y="392" width="250" height="78" rx="10" fill="#ffffff" opacity="0.85"/>
  <text x="80" y="428" font-size="28" font-weight="700" fill="#3d2c1a">Kitchen garden</text>
  <text x="80" y="458" font-size="20" fill="#3d2c1a">Tomatoes, beans, herbs</text>

  <rect x="420" y="380" width="330" height="190" rx="14" fill="#cfe6b5" stroke="#7fae62" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="470" y="474" width="120" height="80" rx="8" fill="#b8412f"/>
  <path d="M458 478 L530 440 L602 478 Z" fill="#8e2f22"/>
  <g fill="#ffffff" stroke="#5b4636" stroke-width="2">
    <ellipse cx="640" cy="470" rx="16" ry="11"/><ellipse cx="682" cy="500" rx="16" ry="11"/><ellipse cx="632" cy="530" rx="16" ry="11"/>
  </g>
  <text x="440" y="416" font-size="28" font-weight="700" fill="#2f5220">Hen house and run</text>

  <rect x="790" y="380" width="170" height="190" rx="10" fill="#b8412f" stroke="#8e2f22" stroke-width="3"/>
  <text x="826" y="484" font-size="30" font-weight="700" fill="#ffffff">Barn</text>

  <rect x="1000" y="400" width="150" height="150" rx="10" fill="#f2c14e" stroke="#c6952a" stroke-width="3"/>
  <text x="1024" y="470" font-size="26" font-weight="700" fill="#5c4717">Farm</text>
  <text x="1024" y="502" font-size="26" font-weight="700" fill="#5c4717">shop</text>

  <g transform="translate(1110 700)">
    <circle r="34" fill="#ffffff" stroke="#6b5a44" stroke-width="2"/>
    <path d="M0 -26 L9 4 L0 -2 L-9 4 Z" fill="#b8412f"/>
    <text x="-8" y="26" font-size="18" font-weight="700" fill="#6b5a44">N</text>
  </g>
  <text x="50" y="720" font-size="20" fill="#6b5a44">Sunny Acre Farm, not to scale</text>
</svg>
