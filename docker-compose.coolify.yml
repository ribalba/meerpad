# meerpad on Coolify: Postgres and the server, as one resource.
#
# Point a Coolify "Docker Compose" resource at this repository and set the
# compose path to `/docker-compose.coolify.yml`. COOLIFY.md walks the deploy,
# including custom domains for published websites. (The sites themselves
# live at https://meerpad.com/v/<name>, which needs nothing extra.)
#
# How this differs from docker-compose.yml, and why:
#
#   * Nothing is published to the host. `web` is reached through Coolify's
#     Traefik, which also terminates TLS: set the domain on the `web` service
#     in the Coolify UI (`https://meerpad.com:8000`). `db` has no host-facing
#     address at all, which is what a database wants.
#
#   * No `networks:` and no `name:`. Coolify creates the project network and
#     names the project after the resource's UUID itself (meerail's file says
#     why a networks block fights it). Service names resolve the same on its
#     network, so `db` is still `db`.
#
#   * No secrets with defaults. The Postgres password and SECRET_KEY are
#     Coolify magic variables: generated once, stored, reused on every
#     redeploy. The laptop stack's `meerpad` password is public knowledge.
#
#   * BASE_URL is required (`:?`): Coolify marks it in the UI and refuses the
#     deploy while it is empty. It cannot default to the Domains field
#     (SERVICE_URL_WEB), because that field also collects the custom domains
#     of published sites, and BASE_URL has to be the one app address.
#
# Plain `docker compose -f docker-compose.coolify.yml config` works too, as
# long as BASE_URL is set; the magic variables are then simply empty.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meerpad}
      # Generated by Coolify: 32 letters and digits, so it can sit inside
      # DATABASE_URL below without percent-encoding (meerail's COOLIFY.md has
      # the story of an `@` in a password read as a host name).
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-meerpad}
    volumes:
      # Postgres 18+ wants the mount at /var/lib/postgresql, not .../data;
      # this layout is what allows an in-place pg_upgrade --link later.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meerpad} -d ${POSTGRES_DB:-meerpad}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        MEERPAD_VERSION: ${MEERPAD_VERSION:-0.0.0}
    depends_on:
      db:
        condition: service_healthy
    # `expose`, not `ports`. Traefik reaches the container over the project
    # network and terminates TLS in front of it; publishing on the host would
    # put an unencrypted second door next to the one it manages, and one that
    # trusts X-Forwarded-For from anybody (see the Dockerfile's CMD).
    #
    # Set the domain on this service in the Coolify UI (Domains:
    # `https://meerpad.com:8000`; the `:8000` names the container port).
    # Declarative alternative, as in meerail's file: uncomment the
    # SERVICE_FQDN line below and Coolify generates a hostname off the
    # server's wildcard domain. The UI field is the reliable path.
    #
    # Published websites need nothing here (they are paths, /v/<name>, on
    # this domain). A custom domain for one is appended to this field;
    # COOLIFY.md, "Published websites".
    expose:
      - "8000"
    environment:
      # SERVICE_FQDN_WEB_8000: ${SERVICE_FQDN_WEB_8000}

      # The app's own public address, e.g. https://meerpad.com. Login links
      # are built from it, and its host is "the app": every other Host header
      # is looked up as a published website.
      BASE_URL: ${BASE_URL:?set BASE_URL to the app's public address, e.g. https://meerpad.com}
      # Signs login codes. Generated by Coolify once and kept; changing it
      # only invalidates sign-in links and codes that are still in flight.
      SECRET_KEY: ${SERVICE_PASSWORD_64_MEERPAD}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meerpad}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-meerpad}
      UPLOAD_DIR: /data/uploads
      IMPORT_DIR: /data/imports

      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      # A Notion export is a whole workspace in one zip. An upload this size
      # outlives Traefik's default 60 s read timeout; COOLIFY.md says how to
      # raise it.
      MAX_IMPORT_BYTES: ${MAX_IMPORT_BYTES:-4294967296}
      DEFAULT_WORKSPACES: ${DEFAULT_WORKSPACES:-Work,Private}

      LOGIN_TOKEN_TTL_MINUTES: ${LOGIN_TOKEN_TTL_MINUTES:-30}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-43200}
      LOGIN_CODE_MAX_ATTEMPTS: ${LOGIN_CODE_MAX_ATTEMPTS:-5}
      LOGIN_RATE_MAX: ${LOGIN_RATE_MAX:-5}
      VERIFY_RATE_MAX: ${VERIFY_RATE_MAX:-15}
      LOGIN_RATE_WINDOW_MINUTES: ${LOGIN_RATE_WINDOW_MINUTES:-15}

      # Without SMTP_HOST the sign-in link and code go to the container log,
      # which is how you sign in the very first time, and nobody else can.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-hello@meerpad.com}

      # Sites are served at BASE_URL/v/<name>. PUBLIC_IP is what the publish
      # dialog tells people to point a custom domain's A record at: this
      # server's public IPv4.
      PUBLIC_IP: ${PUBLIC_IP:-}

      # Not a variable here on purpose: on a server, "download this pasted
      # link" must never be able to reach the host's own network.
      FETCH_ALLOW_PRIVATE: "false"
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-20}

      # Page history: edits group into a session that ends after this many
      # minutes without one, or once it is the second number old. Finished
      # sessions kept per page (app/history.py).
      HISTORY_IDLE_MINUTES: ${HISTORY_IDLE_MINUTES:-10}
      HISTORY_MAX_SESSION_MINUTES: ${HISTORY_MAX_SESSION_MINUTES:-60}
      HISTORY_KEEP_SESSIONS: ${HISTORY_KEEP_SESSIONS:-200}
    volumes:
      # Every uploaded file, and Notion imports while they run. Back it up
      # with pg-data: pages point at files by id.
      - meerpad-data:/data
    # The image's HEALTHCHECK (/healthz) applies; Coolify shows it.
    restart: unless-stopped

volumes:
  pg-data:
  meerpad-data:
